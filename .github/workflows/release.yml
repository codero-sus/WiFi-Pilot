name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.2.0). Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel --outdir dist/

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --force-reinstall dist/wifipilot-*.whl rich fastapi uvicorn
          /tmp/wheel-smoke/bin/wifipilot --version
          /tmp/wheel-smoke/bin/wifipilot --json config > /dev/null
          /tmp/wheel-smoke/bin/wifipilot --no-ai --json ai status > /dev/null
          /tmp/wheel-smoke/bin/wifipilot attacks --json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  build-executable:
    name: Build standalone executable (linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libpython3.12
          python -m pip install --upgrade pip
          pip install '.[web,dev]' pyinstaller

      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm wifipilot.spec 2>&1 | tee /tmp/pyi.log
        env:
          PYTHONNOUSERSITE: "1"

      - name: Build log (on failure)
        if: failure()
        run: |
          echo "=== PyInstaller log tail ==="
          tail -120 /tmp/pyi.log || true
          echo "=== warn-*.txt (if any) ==="
          for f in build/wifipilot/warn-*.txt; do [ -f "$f" ] && { echo "--- $f"; tail -80 "$f"; }; done

      - name: Verify the executable
        run: |
          set +e
          ls -la dist/wifipilot
          file dist/wifipilot
          echo "--- --version ---"
          ./dist/wifipilot --version
          echo "exit=$?"
          echo "--- --json config ---"
          ./dist/wifipilot --json config > /tmp/cfg.json 2> /tmp/cfg.err
          echo "exit=$?"
          head -c 200 /tmp/cfg.json; echo
          echo "stderr:"; head -40 /tmp/cfg.err
          echo "--- --no-ai ai status ---"
          ./dist/wifipilot --no-ai --json ai status
          echo "exit=$?"
          echo "--- attacks --json ---"
          ./dist/wifipilot attacks --json > /tmp/atk.json 2> /tmp/atk.err
          echo "exit=$?"
          head -c 200 /tmp/atk.json; echo
          echo "stderr:"; head -40 /tmp/atk.err
          echo "--- web smoke ---"
          timeout 6 ./dist/wifipilot web --demo --host 127.0.0.1 --port 8799 \
            > /tmp/web.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8799/ > /dev/null 2>&1; then break; fi
            sleep 0.3
          done
          curl -sS -o /tmp/web_root.html -w "web status: %{http_code}\n" http://127.0.0.1:8799/ || true
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "--- web log ---"
          tail -40 /tmp/web.log || true

      - name: Package executable with sha256
        run: |
          chmod +x dist/wifipilot
          cd dist
          tar -czf wifipilot-linux-amd64.tar.gz wifipilot
          sha256sum wifipilot wifipilot-linux-amd64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: dist/

  publish:
    name: Publish GitHub Release
    needs: [build-wheel, build-executable]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Prepare release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          {
            echo "## wifipilot v${VERSION}"
            echo
            echo "### Assets"
            echo
            echo "- \`wifipilot-${VERSION}-py3-none-any.whl\` — install with \`pip install\` (Python ≥ 3.9, Linux)"
            echo "- \`wifipilot\` — standalone Linux x86_64 executable (PyInstaller one-file, no Python install needed)"
            echo "- \`wifipilot-linux-amd64.tar.gz\` — same executable, gzipped"
            echo "- \`SHA256SUMS.txt\` — SHA-256 checksums for the binaries"
            echo
            echo "### Verify"
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "848 attacks · AI optional · web + TUI · Linux only."
          } > /tmp/release-notes.md
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: wifipilot ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: |
            release-artifacts/*.whl
            release-artifacts/wifipilot-linux-amd64.tar.gz
            release-artifacts/wifipilot
            release-artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
