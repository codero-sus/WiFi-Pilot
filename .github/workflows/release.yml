name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.2.0). Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel
        run: python -m build --wheel --outdir dist/

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --force-reinstall dist/wifipilot-*.whl rich fastapi uvicorn
          /tmp/wheel-smoke/bin/wifipilot --version
          /tmp/wheel-smoke/bin/wifipilot --json config > /dev/null
          /tmp/wheel-smoke/bin/wifipilot --no-ai --json ai status > /dev/null
          /tmp/wheel-smoke/bin/wifipilot attacks --json > /dev/null

      - name: Stage release files
        run: |
          mkdir -p upload
          cp dist/wifipilot-*.whl upload/
          ls -la upload/

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: upload/

  build-executable:
    name: Build standalone executable (linux/amd64)
    needs: build-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: wheel/

      - name: Install build dependencies (package + pyinstaller from wheel)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libpython3.12
          python -m pip install --upgrade pip
          # Install from the just-built wheel so PyInstaller sees a real
          # site-packages install (no editable finder hooks, no source
          # tree on sys.path). pyinstaller and dev extras added on top.
          pip install wheel/wifipilot-*.whl
          pip install pyinstaller pytest pytest-xdist httpx ruff pyyaml

      - name: Build one-file executable
        working-directory: ${{ github.workspace }}
        run: |
          pwd
          ls -la
          # Build from the installed package's __main__ so PyInstaller
          # walks site-packages rather than the source tree. Package data
          # (static/, data/) is added explicitly from the checkout via
          # --add-data; the spec is not used here (its analysis uses the
          # repo's script path which pulls the source tree in).
          pyinstaller \
            --clean --noconfirm --onefile \
            --name wifipilot \
            --paths "$(python -c 'import site; print(site.getsitepackages()[0])')" \
            --add-data "wifipilot/web/static:wifipilot/web/static" \
            --add-data "wifipilot/data:wifipilot/data" \
            --add-data "docs:docs" \
            --add-data "LICENSE:." \
            --add-data "NOTICE:." \
            --add-data "THIRD-PARTY.md:." \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.loops.asyncio \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --collect-all wifipilot \
            --exclude-module tkinter --exclude-module pytest --exclude-module _pytest \
            --distpath "$PWD/dist" \
            --workpath "$PWD/build" \
            wifipilot/__main__.py
          echo "--- after build ---"
          ls -la dist/ || echo "no dist/"

      - name: Verify + package
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          {
            echo "## Binary smoke report"
            echo
            echo '```'
            echo "workdir: $(pwd)"
            echo "--- file ---"
            file dist/wifipilot
            echo "--- ls ---"
            ls -la dist/wifipilot
            echo "--- --version ---"
            ./dist/wifipilot --version; echo "exit=$?"
            echo "--- --json config (head) ---"
            ./dist/wifipilot --json config 2>&1 | head -c 600; echo
            echo "--- config exit=${PIPESTATUS[0]} ---"
            echo "--- --no-ai --json ai status ---"
            ./dist/wifipilot --no-ai --json ai status 2>&1 | head -c 400; echo
            echo "--- ai exit=${PIPESTATUS[0]} ---"
            echo "--- attacks --json (head) ---"
            ./dist/wifipilot attacks --json 2>&1 | head -c 400; echo
            echo "--- attacks exit=${PIPESTATUS[0]} ---"
            echo "--- web boot ---"
            timeout 8 ./dist/wifipilot web --demo --host 127.0.0.1 --port 8799 > /tmp/web.log 2>&1 &
            PID=$!
            for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8799/ > /dev/null 2>&1 && break; sleep 0.3; done
            curl -sS -o /dev/null -w "web status: %{http_code}\n" http://127.0.0.1:8799/
            kill $PID 2>/dev/null; wait $PID 2>/dev/null; true
            echo "--- web log tail ---"
            tail -30 /tmp/web.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Generate SHA256.
          (cd dist && sha256sum wifipilot > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          ls -la dist/

      - name: Upload smoke logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: /tmp/smoke/
          if-no-files-found: ignore

      - name: Stage release files
        run: |
          mkdir -p upload
          cp dist/wifipilot upload/wifipilot
          cp dist/SHA256SUMS.txt upload/SHA256SUMS.txt
          ls -la upload/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: upload/

  publish:
    name: Publish GitHub Release
    needs: [build-wheel, build-executable]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Prepare release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          {
            echo "## wifipilot v${VERSION}"
            echo
            echo "### Assets"
            echo
            echo "- \`wifipilot-${VERSION}-py3-none-any.whl\` — install with \`pip install\` (Python ≥ 3.9, Linux)"
            echo "- \`wifipilot\` — standalone Linux x86_64 executable (PyInstaller one-file, no Python install needed)"
            echo "- \`SHA256SUMS.txt\` — SHA-256 checksum for the binary"
            echo
            echo "### Verify"
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "848 attacks · AI optional · web + TUI · Linux only."
          } > /tmp/release-notes.md
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: wifipilot ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: |
            release-artifacts/*.whl
            release-artifacts/wifipilot
            release-artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
