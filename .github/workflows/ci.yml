name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # wifipilot is a Linux-only tool; the suite also asserts that the CLI and the
    # web server refuse to start on other platforms.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Byte-compile everything
        run: python -m compileall -q wifipilot tests

      - name: Import check
        run: python -c "import wifipilot, wifipilot.cli, wifipilot.engine, wifipilot.advisor, wifipilot.web.app; print('imports ok')"

      # pyflakes + syntax only (see [tool.ruff] in pyproject.toml): undefined
      # names on live-only paths are invisible to the demo-driven suite —
      # survey3 called parse_ipv4 without importing it for a whole release,
      # and only a laptop in the field ever found out.  This step is that
      # laptop, minus the embarrassment.
      - name: Error gate (ruff F + E9)
        run: ruff check wifipilot tests tools examples benchmarks

      - name: Crypto self-test (published test vectors)
        run: python -m pytest tests/test_crypto.py -q

      - name: AI provider tests (faked transport + local mock OpenRouter gateway)
        run: python -m pytest tests/test_openrouter.py tests/test_openrouter_http.py -q

      - name: Scriptable API tests
        run: python -m pytest tests/test_api.py -q

      - name: The advisor is optional (off switch, aliases, no-socket promise)
        run: |
          python -m pytest tests/test_ai_optional.py -q
          python -m wifipilot --no-ai --json ai status | grep -q '"disabled": true'
          python -m wifipilot --disable-ai --json ai status | grep -q '"provider": "none"'
          WIFIPILOT_NO_AI=1 python -c "import wifipilot as wp; assert wp.ai()['disabled'] is True"
          python -c "import wifipilot as wp; wp.ai(disable=True); assert wp.ai()['disabled']; wp.ai(disable=False); assert not wp.ai()['disabled']"

      - name: Attack decoders and gates (elements, raw frames, planner)
        run: python -m pytest tests/test_attacks_more.py -q

      - name: Hash files (hashcat mode 22000) round-trip
        run: |
          python -m pytest tests/test_hash22000.py -q
          python - <<'PY'
          from wifipilot.synth import build_capture
          from wifipilot import hash22000
          path, _ = build_capture("/tmp/ci.pcap", "ci-net", "aa:bb:cc:dd:ee:ff",
                                  "02:00:00:00:00:01", "ci-passphrase-1", include_pmkid=True)
          target, count = hash22000.write_capture(path, "/tmp/ci.hc22000")
          lines, problems = hash22000.parse_text(open(target).read())
          assert count == 2 and not problems, (count, problems)
          verifiers = hash22000.verifiers(lines)
          assert len(verifiers) == 2 and all(v.check("ci-passphrase-1") for v in verifiers)
          print("hash round trip ok:", count, "lines")
          PY

      - name: Platform guard (Linux-only enforcement)
        run: python -m pytest tests/test_platform.py -q

      - name: Full test suite
        run: python -m pytest -q

      - name: CLI smoke test (simulation, no radio)
        run: |
          python -m wifipilot tools --json > /dev/null
          python -m wifipilot --demo --json scan -t 2 > /dev/null
          python -m wifipilot analyze wifipilot/data/wifi-defaults.txt > /dev/null 2>&1 || true
          python -m wifipilot --json config > /dev/null

      - name: Library smoke test (import + demo pipeline, no radio)
        run: |
          python - <<'PY'
          import wifipilot as wp
          assert wp.ALL == "all" and "force" in wp.MODES
          wp.configure(demo=True, provider="none")
          survey = wp.scan(duration=2)
          assert len(survey) > 0, "the simulator should produce access points"
          print("api ok:", len(survey), "APs")
          PY

      - name: CLI export round-trip (no hashcat, no hcxtools)
        run: |
          python - <<'PY'
          from wifipilot.synth import build_capture
          build_capture("/tmp/cli.pcap", "ci-net", "aa:bb:cc:dd:ee:ff",
                        "02:00:00:00:00:01", "ci-passphrase-1", include_pmkid=True)
          PY
          python -m wifipilot export /tmp/cli.pcap --out /tmp/ci-cli.hc22000 --no-color
          python -m wifipilot --json analyze /tmp/ci-cli.hc22000 | grep -q '"format": "hc22000"'
          echo "cli export ok"

      - name: Benchmarks run (and their output parses)
        run: |
          python benchmarks/bench.py pcap session --json /tmp/bench.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/bench.json"))
          names = [row["benchmark"] for row in data["results"]]
          assert any(name.startswith("pcap") for name in names), names
          print("benchmarks ok:", len(names), "measurements")
          PY

      - name: Provider smoke test (no network calls)
        run: |
          python -m wifipilot ai providers --json > /dev/null
          python -m wifipilot ai --provider openrouter --json status > /dev/null
          python -m wifipilot ai models --json > /dev/null 2>&1 || true

      - name: Web API smoke test
        run: |
          python - <<'PY'
          import json
          from fastapi.testclient import TestClient
          from wifipilot.config import Config
          from wifipilot.web.app import create_app
          app = create_app(Config(demo=True), demo=True)
          with TestClient(app) as client:
              assert client.get("/").status_code == 200
              state = client.get("/api/state").json()
              assert "access_points" in state and "advisor" in state
              assert "openrouter" not in json.dumps(state["config"]) or \
                  "sk-or" not in json.dumps(state["config"])
              assert "provider" in state["advisor"]
              assert client.post("/api/ai/think", json={}).status_code == 200
          print("web api ok")
          PY
