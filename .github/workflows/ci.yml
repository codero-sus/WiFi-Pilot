name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # wifipilot is a Linux-only tool; the suite also asserts that the CLI and the
    # web server refuse to start on other platforms.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Byte-compile everything
        run: python -m compileall -q wifipilot tests

      - name: Import check
        run: python -c "import wifipilot, wifipilot.cli, wifipilot.engine, wifipilot.advisor, wifipilot.web.app; print('imports ok')"

      - name: Crypto self-test (published test vectors)
        run: python -m pytest tests/test_crypto.py -q

      - name: AI provider tests (faked transport + local mock OpenRouter gateway)
        run: python -m pytest tests/test_openrouter.py tests/test_openrouter_http.py -q

      - name: Platform guard (Linux-only enforcement)
        run: python -m pytest tests/test_platform.py -q

      - name: Full test suite
        run: python -m pytest -q

      - name: CLI smoke test (simulation, no radio)
        run: |
          python -m wifipilot tools --json > /dev/null
          python -m wifipilot --demo --json scan -t 2 > /dev/null
          python -m wifipilot analyze wifipilot/data/wifi-defaults.txt > /dev/null 2>&1 || true
          python -m wifipilot --json config > /dev/null

      - name: Provider smoke test (no network calls)
        run: |
          python -m wifipilot ai providers --json > /dev/null
          python -m wifipilot ai --provider openrouter --json status > /dev/null
          python -m wifipilot ai models --json > /dev/null 2>&1 || true

      - name: Web API smoke test
        run: |
          python - <<'PY'
          import json
          from fastapi.testclient import TestClient
          from wifipilot.config import Config
          from wifipilot.web.app import create_app
          app = create_app(Config(demo=True), demo=True)
          with TestClient(app) as client:
              assert client.get("/").status_code == 200
              state = client.get("/api/state").json()
              assert "access_points" in state and "advisor" in state
              assert "openrouter" not in json.dumps(state["config"]) or \
                  "sk-or" not in json.dumps(state["config"])
              assert "provider" in state["advisor"]
              assert client.post("/api/ai/think", json={}).status_code == 200
          print("web api ok")
          PY
