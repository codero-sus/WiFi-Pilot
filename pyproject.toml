[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifipilot"
version = "0.1.0"
description = "Wifite alternative: AI-piloted WiFi auditing with a local-LLM (Ollama) advisor and a web UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "codero-sus" }]
keywords = ["wifi", "pentest", "wifite", "aircrack-ng", "wps", "pmkid", "ollama", "llm", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.4", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
wifipilot = "wifipilot.cli:main"

[project.urls]
Homepage = "https://github.com/codero-sus/Pentest-toolkit"

[tool.setuptools.packages.find]
include = ["wifipilot*"]

[tool.setuptools.package-data]
wifipilot = ["web/static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
