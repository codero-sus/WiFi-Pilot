# GitGuardian configuration — wifipilot is a Wi-Fi penetration-testing tool.
#
# Its test suite and demo/synthetic-data generators contain INVENTED passwords
# by design: the tests build fake captures with known passwords and then prove
# the cracker recovers them, and synth.py fabricates network packets carrying
# textbook default credentials (admin/admin).  None of these are real secrets:
# real credentials (OpenRouter/Cortex keys, target PSKs) only ever arrive via
# environment/config at runtime and are redacted from every output.
#
# This file tells the scanner exactly that, narrowly:
#   * tests/** and the synthetic-packet generator are fixture territory;
#   * the handful of invented password strings below are known-safe.
# Everything else stays fully scanned.  Real secrets must still NEVER be
# committed — if one ever is, rotate it; do not add it here.
#
# Both key styles are included: `secret.ignored_*` is the current (v2)
# ggshield schema; the top-level `paths-ignore`/`matches-ignore` are the
# legacy keys the GitHub App is reported to honour.
version: 2

paths-ignore:
  - "tests/**/*"
  - "wifipilot/synth.py"

matches-ignore:
  - name: base64 of default admin:admin inside a synthetic HTTP packet
    match: "YWRtaW46YWRtaW4="
  - name: demo-mode placeholder password
    match: "wifipilot-demo"
  - name: fake demo-world AP password
    match: "password123"
  - name: synthetic PMKID test target password
    match: "hunter2-is-bad"
  - name: shared test-fixture PSK (tests/conftest.py)
    match: "TestNet2024"
  - name: synthetic capture passwords the strategy tests crack
    match: "BenchNet2024"
  - name: synthetic capture passwords the strategy tests crack
    match: "zzqqww9911xy"
  - name: rule-mutation fixture password
    match: "benchnetx"

secret:
  ignored_paths:
    - "tests/**/*"
    - "wifipilot/synth.py"
  ignored_matches:
    - name: base64 of default admin:admin inside a synthetic HTTP packet
      match: "YWRtaW46YWRtaW4="
    - name: demo-mode placeholder password
      match: "wifipilot-demo"
    - name: fake demo-world AP password
      match: "password123"
    - name: synthetic PMKID test target password
      match: "hunter2-is-bad"
    - name: shared test-fixture PSK (tests/conftest.py)
      match: "TestNet2024"
    - name: synthetic capture passwords the strategy tests crack
      match: "BenchNet2024"
    - name: synthetic capture passwords the strategy tests crack
      match: "zzqqww9911xy"
    - name: rule-mutation fixture password
      match: "benchnetx"
